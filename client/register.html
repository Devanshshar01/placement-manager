<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Placement Management System</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/toast.css">
</head>

<body>
    <div class="auth-container" style="padding: 2rem 0;">
        <div class="card auth-card" style="max-width: 700px;">
            <h2 class="text-center mb-4">Create Account</h2>

            <div class="flex justify-center gap-4 mb-4">
                <button class="btn btn-outline active" id="btn-student" onclick="toggleForm('student')">Student
                    Registration</button>
                <button class="btn btn-outline" id="btn-admin" onclick="toggleForm('admin')">Admin Registration</button>
            </div>

            <!-- Student Form -->
            <form id="student-form">
                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="john@college.edu" required>
                    </div>
                </div>

                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Min 6 chars" required
                            minlength="6">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210">
                    </div>
                </div>

                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Roll Number</label>
                        <input type="text" name="roll_number" class="form-control" placeholder="CS2023001" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Branch</label>
                        <select name="branch" class="form-control" required>
                            <option value="">Select Branch</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">CGPA</label>
                        <input type="number" step="0.01" min="0" max="10" name="cgpa" class="form-control"
                            placeholder="8.5" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Resume URL (Google Drive/Dropbox)</label>
                    <input type="url" name="resume_url" class="form-control" placeholder="https://drive.google.com/...">
                </div>

                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">LinkedIn Profile</label>
                        <input type="url" name="linkedin_url" class="form-control"
                            placeholder="https://linkedin.com/in/...">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">GitHub Profile</label>
                        <input type="url" name="github_url" class="form-control" placeholder="https://github.com/...">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Skills (Comma separated)</label>
                    <input type="text" name="skills" class="form-control" placeholder="Java, Python, React, SQL">
                </div>

                <button type="submit" id="student-btn" class="btn btn-primary btn-block">Register as Student</button>
            </form>

            <!-- Admin Form -->
            <form id="admin-form" class="hidden">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">Admin Key</label>
                    <input type="password" name="admin_key" class="form-control" required
                        placeholder="Enter secret key provided by college">
                </div>
                <button type="submit" id="admin-btn" class="btn btn-primary btn-block">Register as Admin</button>
            </form>

            <p class="text-center mt-4">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function toggleForm(type) {
            const studentForm = document.getElementById('student-form');
            const adminForm = document.getElementById('admin-form');
            const btnStudent = document.getElementById('btn-student');
            const btnAdmin = document.getElementById('btn-admin');

            if (type === 'student') {
                studentForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
                btnStudent.classList.add('active');
                btnStudent.style.background = 'var(--primary)';
                btnStudent.style.color = 'white';
                btnAdmin.style.background = 'transparent';
                btnAdmin.style.color = 'var(--primary)';
            } else {
                studentForm.classList.add('hidden');
                adminForm.classList.remove('hidden');
                btnAdmin.style.background = 'var(--primary)';
                btnAdmin.style.color = 'white';
                btnStudent.style.background = 'transparent';
                btnStudent.style.color = 'var(--primary)';
            }
        }
        // Init state
        toggleForm('student');

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('student-btn');
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            Auth.setLoading(btn, true);

            try {
                await Auth.registerStudent(data);
                Auth.showToast('Registration successful! Please login.', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
                Auth.showToast(err.message, 'error');
                Auth.setLoading(btn, false);
            }
        });

        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('admin-btn');
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            Auth.setLoading(btn, true);

            try {
                await Auth.registerAdmin(data);
                Auth.showToast('Admin registration successful! Please login.', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
                Auth.showToast(err.message, 'error');
                Auth.setLoading(btn, false);
            }
        });
    </script>
</body>

</html>
