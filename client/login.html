<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Placement Management System</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/toast.css">
</head>

<body>
    <div class="auth-container">
        <div class="card auth-card">
            <h2 class="text-center mb-4">Welcome Back</h2>
            <form id="login-form" action="javascript:void(0);" onsubmit="return false;">
                <div class="form-group">
                    <label class="form-label">I am a...</label>
                    <div class="flex gap-4">
                        <label style="flex: 1; cursor: pointer;">
                            <input type="radio" name="role" value="student" checked> Student
                        </label>
                        <label style="flex: 1; cursor: pointer;">
                            <input type="radio" name="role" value="admin"> Admin
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••"
                            required>
                        <button type="button" onclick="togglePassword()"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-light);">
                            👁️
                        </button>
                    </div>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <label class="flex items-center gap-2" style="font-size: 0.9rem;">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" style="font-size: 0.9rem;">Forgot Password?</a>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary btn-block">Login</button>
            </form>
            <p class="text-center mt-4">
                Don't have an account? <a href="register.html">Register</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            Auth.setLoading(btn, true);

            try {
                const user = await Auth.login(data.email, data.password, data.role);
                Auth.showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    if (user.role === 'student') {
                        window.location.href = '/student/dashboard.html';
                    } else {
                        window.location.href = '/admin/dashboard.html';
                    }
                }, 1000);
            } catch (err) {
                Auth.showToast(err.message, 'error');
                Auth.setLoading(btn, false);
            }
        });
    </script>
</body>

</html>
