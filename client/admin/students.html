<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - PMS Admin</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/toast.css">
    <style>
        .filters-bar {
            background: white;
            padding: 1rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .data-table th,
        .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            background: #f9fafb;
            font-weight: 600;
            color: var(--text-light);
        }

        .data-table tr:hover {
            background: #f9fafb;
        }

        .modal-body {
            max-height: 70vh;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="dashboard.html" class="nav-brand">PMS Admin</a>
            <div class="nav-links">
                <span id="user-name" class="nav-link">Admin</span>
                <a href="#" onclick="Auth.logout()" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-grid">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="sidebar-link">Dashboard</a>
                    <a href="students.html" class="sidebar-link active">Students</a>
                    <a href="companies.html" class="sidebar-link">Companies</a>
                    <a href="drives.html" class="sidebar-link">Job Drives</a>
                    <a href="applications.html" class="sidebar-link">Applications</a>
                </nav>
            </aside>

            <section class="content">
                <div class="flex justify-between items-center mb-4">
                    <h2>Manage Students</h2>
                    <button onclick="exportStudents()" class="btn btn-outline btn-sm">Export to Excel</button>
                </div>

                <!-- Filters -->
                <div class="filters-bar">
                    <div style="flex: 2; min-width: 200px;">
                        <input type="text" id="search-input" class="form-control"
                            placeholder="Search name, roll no, email...">
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <select id="filter-branch" class="form-control">
                            <option value="">All Branches</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <input type="number" id="filter-cgpa" class="form-control" placeholder="Min CGPA">
                    </div>
                    <button id="filter-btn" class="btn btn-primary">Apply</button>
                </div>

                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Roll No</th>
                                <th>Name</th>
                                <th>Branch</th>
                                <th>CGPA</th>
                                <th>Apps</th>
                                <th>Resume</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-table-body">
                            <tr>
                                <td colspan="7" class="text-center p-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Student Details Modal -->
    <div id="student-modal" class="modal hidden"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center;">
        <div class="card" style="width: 90%; max-width: 700px;">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title">Student Details</h2>
                <button onclick="closeModal()"
                    style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <div id="modal-content" class="modal-body">
                <!-- Content injected via JS -->
            </div>
            <div class="flex justify-end gap-4 mt-4">
                <button onclick="closeModal()" class="btn btn-outline">Close</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        function closeModal() {
            document.getElementById('student-modal').style.display = 'none';
        }
    </script>
</body>

</html>
