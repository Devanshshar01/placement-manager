<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - PMS</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/toast.css">
    <style>
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: white;
            min-height: 42px;
        }

        .tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .tag-close {
            cursor: pointer;
            font-weight: bold;
        }

        .tag-input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 100px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="dashboard.html" class="nav-brand">PMS Student</a>
            <div class="nav-links">
                <span id="user-name" class="nav-link">Student</span>
                <a href="#" onclick="Auth.logout()" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-grid">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="sidebar-link">Dashboard</a>
                    <a href="profile.html" class="sidebar-link active">My Profile</a>
                    <a href="drives.html" class="sidebar-link">Browse Drives</a>
                    <a href="applications.html" class="sidebar-link">My Applications</a>
                    <a href="notifications.html" class="sidebar-link">Notifications</a>
                </nav>
            </aside>

            <section class="content">
                <div class="card">
                    <h2 class="mb-4">Edit Profile</h2>
                    <form id="profile-form">
                        <!-- Personal Info -->
                        <h4 class="mb-2 text-primary">Personal Information</h4>
                        <div class="flex gap-4">
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="name" class="form-control" readonly style="background: #f3f4f6;">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="email" class="form-control" readonly
                                    style="background: #f3f4f6;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phone" id="phone" class="form-control">
                        </div>

                        <hr class="my-4" style="border-top: 1px solid var(--border);">

                        <!-- Academic Info -->
                        <h4 class="mb-2 text-primary">Academic Information</h4>
                        <div class="flex gap-4">
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">Roll Number</label>
                                <input type="text" id="roll_number" class="form-control" readonly
                                    style="background: #f3f4f6;">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">Branch</label>
                                <input type="text" id="branch" class="form-control" readonly
                                    style="background: #f3f4f6;">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">CGPA</label>
                                <input type="number" id="cgpa" class="form-control" readonly
                                    style="background: #f3f4f6;">
                            </div>
                        </div>

                        <hr class="my-4" style="border-top: 1px solid var(--border);">

                        <!-- Professional Links -->
                        <h4 class="mb-2 text-primary">Professional Links</h4>
                        <div class="form-group">
                            <label class="form-label">Resume URL</label>
                            <input type="url" name="resume_url" id="resume_url" class="form-control"
                                placeholder="https://drive.google.com/...">
                        </div>
                        <div class="flex gap-4">
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">LinkedIn Profile</label>
                                <input type="url" name="linkedin_url" id="linkedin_url" class="form-control">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label class="form-label">GitHub Profile</label>
                                <input type="url" name="github_url" id="github_url" class="form-control">
                            </div>
                        </div>

                        <!-- Skills -->
                        <div class="form-group">
                            <label class="form-label">Skills</label>
                            <div class="tag-container" id="skills-container">
                                <input type="text" class="tag-input" id="skills-input"
                                    placeholder="Type and press Enter">
                            </div>
                            <input type="hidden" name="skills" id="skills-hidden">
                        </div>

                        <button type="submit" id="save-btn" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student.js"></script>
</body>

</html>
