<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - PMS</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/toast.css">
    <style>
        .notif-group-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-light);
            margin: 1.5rem 0 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .notif-item {
            background: white;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
            display: flex;
            gap: 1rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .notif-item:hover {
            box-shadow: var(--shadow-sm);
            transform: translateX(2px);
        }

        .notif-item.unread {
            background: #f0f9ff;
            border-left: 4px solid var(--primary);
        }

        .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .notif-content {
            flex: 1;
        }

        .notif-time {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        .notif-actions {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .notif-item:hover .notif-actions {
            opacity: 1;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="dashboard.html" class="nav-brand">PMS Student</a>
            <div class="nav-links">
                <span id="user-name" class="nav-link">Student</span>
                <a href="#" onclick="Auth.logout()" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-grid">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="sidebar-link">Dashboard</a>
                    <a href="profile.html" class="sidebar-link">My Profile</a>
                    <a href="drives.html" class="sidebar-link">Browse Drives</a>
                    <a href="applications.html" class="sidebar-link">My Applications</a>
                    <a href="notifications.html" class="sidebar-link active">Notifications</a>
                </nav>
            </aside>

            <section class="content">
                <div class="flex justify-between items-center mb-4">
                    <h2>Notifications</h2>
                    <div class="flex gap-2">
                        <button onclick="markAllRead()" class="btn btn-outline btn-sm">Mark all as read</button>
                    </div>
                </div>

                <div id="notifications-container">
                    <p class="text-center text-muted">Loading notifications...</p>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student.js"></script>
</body>

</html>
