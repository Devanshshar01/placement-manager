<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - PMS</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/toast.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <style>
        .tabs {
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text-light);
            font-weight: 500;
            white-space: nowrap;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
            background: #f3f4f6;
            padding: 0.25rem;
            border-radius: var(--radius-md);
        }

        .view-btn {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-light);
        }

        .view-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* Table Styles */
        .app-table {
            width: 100%;
            border-collapse: collapse;
        }

        .app-table th,
        .app-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .app-table th {
            background: #f9fafb;
            font-weight: 600;
            color: var(--text-light);
        }

        /* Card Styles */
        .app-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .status-timeline {
            display: flex;
            align-items: center;
            margin-top: 1rem;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .timeline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        .timeline-dot.active {
            background: var(--primary);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="dashboard.html" class="nav-brand">PMS Student</a>
            <div class="nav-links">
                <span id="user-name" class="nav-link">Student</span>
                <a href="#" onclick="Auth.logout()" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-grid">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="sidebar-link">Dashboard</a>
                    <a href="profile.html" class="sidebar-link">My Profile</a>
                    <a href="drives.html" class="sidebar-link">Browse Drives</a>
                    <a href="applications.html" class="sidebar-link active">My Applications</a>
                    <a href="notifications.html" class="sidebar-link">Notifications</a>
                </nav>
            </aside>

            <section class="content">
                <div class="flex justify-between items-center mb-4">
                    <h2>My Applications</h2>
                    <div class="flex gap-4">
                        <button onclick="exportPDF()" class="btn btn-outline flex items-center gap-2">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            Export PDF
                        </button>
                        <div class="view-toggle">
                            <div class="view-btn active" onclick="toggleView('table')" title="Table View">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <line x1="8" y1="6" x2="21" y2="6"></line>
                                    <line x1="8" y1="12" x2="21" y2="12"></line>
                                    <line x1="8" y1="18" x2="21" y2="18"></line>
                                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                                </svg>
                            </div>
                            <div class="view-btn" onclick="toggleView('card')" title="Card View">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="14" width="7" height="7"></rect>
                                    <rect x="3" y="14" width="7" height="7"></rect>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="filterApps('All')">All Applications</div>
                    <div class="tab" onclick="filterApps('Applied')">Applied</div>
                    <div class="tab" onclick="filterApps('Shortlisted')">Shortlisted</div>
                    <div class="tab" onclick="filterApps('Selected')">Selected</div>
                    <div class="tab" onclick="filterApps('Rejected')">Rejected</div>
                </div>

                <div id="applications-container">
                    <p class="text-center text-muted">Loading applications...</p>
                </div>
            </section>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student.js"></script>
    <script>
        // View Toggle Logic
        let currentView = 'table';
        function toggleView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            // Re-render handled by student.js logic which we will trigger or expose
            if (window.renderApplications) window.renderApplications();
        }
    </script>
</body>

</html>
